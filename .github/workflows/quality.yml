name: Web quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - github-native-foundation

permissions:
  contents: read

jobs:
  quality:
    name: Web build, type check, and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Production build
        run: bun run build

      - name: Type check
        run: bun run typecheck

      - name: Lint
        run: bun run lint
